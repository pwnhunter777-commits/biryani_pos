<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Base App Background with Squircle / Circle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner Subtle Border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.15" />

  <!-- Aromatic Steam Rising from Biryani Pot -->
  <g stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round" fill="none" filter="url(#glow)">
    <path d="M 210 170 C 195 130, 235 100, 210 60" />
    <path d="M 256 160 C 240 115, 275 85, 256 45" />
    <path d="M 302 170 C 320 130, 280 100, 302 60" />
  </g>

  <!-- Main Biryani Handi / Cooking Pot Container -->
  <!-- Pot Rim / Lid Seal -->
  <ellipse cx="256" cy="205" rx="142" ry="24" fill="#ffffff" filter="url(#glow)" />
  <ellipse cx="256" cy="202" rx="128" ry="18" fill="#dbeafe" />

  <!-- Handi Pot Body -->
  <path d="M 120 205 C 105 270, 135 370, 256 370 C 377 370, 407 270, 392 205 Z" fill="#ffffff" filter="url(#glow)" />

  <!-- Pot Highlight / Saffron Stripe -->
  <path d="M 148 245 C 180 260, 332 260, 364 245 C 360 275, 330 330, 256 330 C 182 330, 152 275, 148 245 Z" fill="#eff6ff" />

  <!-- Side Handles of Traditional Handi -->
  <path d="M 112 215 C 80 215, 80 250, 115 255" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
  <path d="M 400 215 C 432 215, 432 250, 397 255" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />

  <!-- POS Receipt / Lightning Badge in Center of Pot -->
  <g transform="translate(256, 290)">
    <!-- Small POS Bill Icon inside Pot -->
    <rect x="-42" y="-45" width="84" height="90" rx="10" fill="#1d4ed8" />
    <!-- Receipt Lines -->
    <line x1="-26" y1="-25" x2="26" y2="-25" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
    <line x1="-26" y1="-10" x2="16" y2="-10" stroke="#93c5fd" stroke-width="5" stroke-linecap="round" />
    <line x1="-26" y1="5" x2="26" y2="5" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
    <line x1="-26" y1="20" x2="6" y2="20" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" />
    <!-- Thermal Paper Serrated Edge at Bottom -->
    <path d="M -42 45 L -28 39 L -14 45 L 0 39 L 14 45 L 28 39 L 42 45" stroke="#1d4ed8" stroke-width="3" fill="#1d4ed8" />
  </g>

  <!-- Bottom Banner with "POS" Emblem -->
  <rect x="176" y="405" width="160" height="42" rx="21" fill="#ffffff" filter="url(#glow)" />
  <text x="256" y="433" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="#1d4ed8" letter-spacing="3">POS BILL</text>
</svg>
