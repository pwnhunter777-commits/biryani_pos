<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="25%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <linearGradient id="goldRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <linearGradient id="copperPotGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="35%" stop-color="#d97706" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="90%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <linearGradient id="emeraldPlaqueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>

    <linearGradient id="silverChromeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="75%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="chickenRoastGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="45%" stop-color="#d97706" />
      <stop offset="85%" stop-color="#9a3412" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <linearGradient id="riceMoundGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="80%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Ambient Dark Container Circle for Contrast -->
  <circle cx="256" cy="256" r="248" fill="#0f172a" />
  <circle cx="256" cy="256" r="244" stroke="url(#goldRimGrad)" stroke-width="6" stroke-opacity="0.7" />

  <!-- 1. CHEF HAT -->
  <g filter="url(#logoShadow)">
    <path d="M 195 130 C 170 120 155 85 180 55 C 205 25 245 35 256 50 C 275 30 325 35 340 70 C 355 100 335 125 315 135 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="4" />
    <path d="M 215 65 C 220 95 230 115 240 130" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M 275 58 C 270 90 275 115 285 130" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M 192 130 Q 256 142 320 130 L 322 148 Q 256 160 190 148 Z" fill="url(#goldTextGrad)" stroke="#854d0e" stroke-width="2.5" />
  </g>

  <!-- Steam Puffs -->
  <g opacity="0.75" stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M 140 120 C 130 90 155 70 145 40" />
    <path d="M 165 105 C 160 80 175 65 170 45" />
  </g>

  <!-- 2. POS BILLING TERMINAL -->
  <g filter="url(#logoShadow)">
    <path d="M 390 280 L 415 280 L 405 240 L 385 240 Z" fill="#334155" />
    <ellipse cx="400" cy="282" rx="35" ry="10" fill="#1e293b" />
    <rect x="320" y="110" width="145" height="125" rx="14" fill="#1e293b" stroke="url(#goldRimGrad)" stroke-width="3.5" transform="rotate(6, 392, 172)" />
    <rect x="328" y="118" width="129" height="109" rx="8" fill="#0f172a" transform="rotate(6, 392, 172)" />
    <g transform="rotate(6, 392, 172)">
      <circle cx="345" cy="138" r="10" fill="#ea580c" />
      <rect x="362" y="132" width="45" height="5" rx="2" fill="#94a3b8" />
      <rect x="422" y="132" width="22" height="12" rx="3" fill="#16a34a" />
      <circle cx="345" cy="162" r="10" fill="#eab308" />
      <rect x="362" y="156" width="50" height="5" rx="2" fill="#94a3b8" />
      <rect x="422" y="156" width="22" height="12" rx="3" fill="#16a34a" />
      <circle cx="345" cy="186" r="10" fill="#f97316" />
      <rect x="362" y="180" width="40" height="5" rx="2" fill="#94a3b8" />
      <rect x="422" y="180" width="22" height="12" rx="3" fill="#16a34a" />
    </g>
    <path d="M 375 110 L 375 70 Q 405 60 435 70 L 435 110 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
    <line x1="385" y1="78" x2="425" y2="78" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
    <line x1="385" y1="85" x2="415" y2="85" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
    <line x1="385" y1="92" x2="425" y2="92" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
    <line x1="385" y1="99" x2="405" y2="99" stroke="#16a34a" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- 3. TRADITIONAL COPPER BIRYANI HANDI POT -->
  <g filter="url(#logoShadow)">
    <path d="M 52 230 C 35 230 35 270 55 278" stroke="url(#goldRimGrad)" stroke-width="16" stroke-linecap="round" fill="none" />
    <path d="M 320 230 C 340 230 340 270 320 278" stroke="url(#goldRimGrad)" stroke-width="16" stroke-linecap="round" fill="none" />
    <path d="M 60 215 C 50 285 75 345 190 350 C 300 345 325 285 315 215 Z" fill="url(#copperPotGrad)" stroke="#78350f" stroke-width="4" />
    <ellipse cx="187" cy="214" rx="130" ry="26" fill="url(#goldRimGrad)" stroke="#78350f" stroke-width="4" />
    <ellipse cx="187" cy="212" rx="122" ry="21" fill="#78350f" />

    <!-- 4. BIRYANI RICE & CHICKEN -->
    <ellipse cx="187" cy="208" rx="116" ry="34" fill="url(#riceMoundGrad)" />
    <g stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.75">
      <line x1="120" y1="205" x2="132" y2="208" />
      <line x1="140" y1="195" x2="152" y2="198" />
      <line x1="170" y1="215" x2="182" y2="216" />
      <line x1="210" y1="202" x2="222" y2="206" />
    </g>
    <g transform="rotate(-28, 145, 175)">
      <ellipse cx="90" cy="170" rx="9" ry="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
      <ellipse cx="90" cy="180" rx="9" ry="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
      <rect x="94" y="168" width="22" height="14" rx="3" fill="#f1f5f9" />
      <path d="M 110 160 C 130 145 170 145 190 165 C 205 180 200 205 180 215 C 155 225 125 210 110 190 Z" fill="url(#chickenRoastGrad)" stroke="#451a03" stroke-width="3.5" />
    </g>
    <g fill="#16a34a" stroke="#14532d" stroke-width="2">
      <path d="M 115 190 Q 95 180 100 170 Q 115 175 115 190 Z" fill="#22c55e" />
      <path d="M 215 185 Q 205 165 220 160 Q 230 175 215 185 Z" fill="#22c55e" />
    </g>
  </g>

  <!-- 5. 3D GOLDEN "BRIYANI" TITLE -->
  <g filter="url(#logoShadow)">
    <text x="256" y="350" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" fontSize="88" font-weight="900" font-style="italic" letter-spacing="2" fill="#451a03" stroke="#291305" stroke-width="18" stroke-linejoin="round">Briyani</text>
    <text x="256" y="346" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" fontSize="88" font-weight="900" font-style="italic" letter-spacing="2" fill="#ca8a04" stroke="#854d0e" stroke-width="10" stroke-linejoin="round">Briyani</text>
    <text x="256" y="342" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" fontSize="88" font-weight="900" font-style="italic" letter-spacing="2" fill="url(#goldTextGrad)">Briyani</text>
  </g>

  <!-- 6. EMERALD GREEN OVAL "POS" PLAQUE -->
  <g filter="url(#logoShadow)">
    <g fill="#15803d" stroke="#facc15" stroke-width="3">
      <path d="M 65 405 Q 40 375 75 365 Q 90 395 65 405 Z" fill="#16a34a" />
      <line x1="60" y1="388" x2="75" y2="382" stroke="#facc15" stroke-width="2" />
      <path d="M 445 405 Q 470 375 435 365 Q 420 395 445 405 Z" fill="#16a34a" />
      <line x1="450" y1="388" x2="435" y2="382" stroke="#facc15" stroke-width="2" />
    </g>
    <ellipse cx="256" cy="420" rx="160" ry="48" fill="url(#goldRimGrad)" stroke="#451a03" stroke-width="5" />
    <ellipse cx="256" cy="420" rx="148" ry="38" fill="url(#emeraldPlaqueGrad)" stroke="#fef08a" stroke-width="3" />
    <text x="256" y="437" text-anchor="middle" font-family="'Arial Black', 'Impact', sans-serif" fontSize="54" font-weight="900" letter-spacing="12" fill="#022c22" stroke="#000000" stroke-width="10" stroke-linejoin="round">POS</text>
    <text x="256" y="434" text-anchor="middle" font-family="'Arial Black', 'Impact', sans-serif" fontSize="54" font-weight="900" letter-spacing="12" fill="url(#silverChromeGrad)" stroke="#475569" stroke-width="1.5">POS</text>
    <circle cx="120" cy="420" r="4" fill="#fef08a" />
    <circle cx="392" cy="420" r="4" fill="#fef08a" />
  </g>
</svg>
